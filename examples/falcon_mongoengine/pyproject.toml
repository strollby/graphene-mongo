[project]
name = "graphene-mongo-falcon-example"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "falcon>=4.0.0",
    "uvicorn[standard]>=0.30.0",
    "graphene-mongo",
    "mongoengine",
    "mongomock>=4.1.2",
    "httpx>=0.27.0",
]

[tool.uv.sources]
graphene-mongo = { path = "../.." }
mongoengine = { git = "https://github.com/strollby/mongoengine", rev = "v0.30.0-alpha.3" }

[tool.pytest.ini_options]
asyncio_mode = "auto"
python_files = ["tests.py", "test_*.py", "*_tests.py"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"