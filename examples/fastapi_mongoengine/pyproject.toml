[project]
name = "graphene-mongo-fastapi-example"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "graphene-mongo",
    "mongoengine",
    "mongomock>=4.1.2",
    "httpx>=0.27.0",
    "pytest-asyncio>=0.23.0",
]

[tool.uv.sources]
graphene-mongo = { path = "../.." }
mongoengine = { git = "https://github.com/strollby/mongoengine", rev = "v0.30.0-alpha.2" }

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"