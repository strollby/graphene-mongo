[project]
name = "graphene-mongo"
version = "0.5.0"
description = "Graphene Mongoengine integration"
authors = [
    {name = "Abaw Chen", email = "abaw.chen@gmail.com"},
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.10,<4"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: PyPy",
    "License :: OSI Approved :: MIT License",
]
keywords = [
    "graphene-mongo", "graphql", "api", "graphql", "protocol", "relay", "graphene", "mongo", "mongoengine"
]
dependencies = [
    "graphene>=3.1.1",
    "graphene-federation>=3.1.5",
    "promise>=2.3",
    "mongoengine",
    "aiodataloader>=0.4.3",
]

[project.urls]
Homepage = "https://github.com/graphql-python/graphene-mongo"
Repository = "https://github.com/graphql-python/graphene-mongo"

[tool.uv.sources]
mongoengine = { git = "https://github.com/strollby/mongoengine", rev = "v0.30.0-alpha.2" }

[dependency-groups]
dev = [
    "pytest",
    "mongomock>=4.1.2",
    "mock>=5.0.1",
    "pytest-cov",
    "pytest-asyncio",
    "ruff",
    "setuptools>=69.0.2,<79.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["graphene_mongo"]
exclude = ["graphene_mongo/tests"]

[tool.coverage.run]
omit = ["*/tests/*"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-v -s"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"